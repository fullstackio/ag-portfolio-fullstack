name: ag-portfolio-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me-root}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ag_portfolio}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-ag_portfolio_app}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-change-me}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo-user.js:/docker-entrypoint-initdb.d/init-mongo-user.js:ro
    ports:
      - '27017:27017'
    networks:
      - ag-portfolio
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-change-me-root}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ag_portfolio}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ag-portfolio
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  ag-portfolio:
    driver: bridge

volumes:
  mongo_data:
